version: 2
models:
  - name: stg_redo_customers
    description: "Cleaned customer data with standardized fields and validated zip codes"
    columns:
      - name: customer_id
        description: "Each order has a unique customer_id"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier of a customer"
        tests:
          - not_null
      - name: customer_zip_code
        description: "First five digits of the customer zip code, checked for appropriate values."
      - name: customer_city
        description: "Customer city name, lower case"
      - name: customer_state
        description: "Two-letter abbreviation for the customer state, upper case"
      - name: city_state
        description: "Customer`s city-state"
  - name: stg_redo_orders
    description: "Cleaned order data with standardized status and delivery metrics"
    columns:
      - name: order_id
        description: "Unique identifier of the order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Key to the customer dataset. Each order has a unique customer_id"
        tests:
          - not_null
      - name: order_status
        description: "Reference to the order status"
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_at
        description: "Shows the purchase timestamp"
      - name: order_approved_at
        description: "Shows the payment approval timestamp(null if not approved)"
      - name: order_delivered_carrier_at
        description: "Shows the order posting timestamp. When it was handled to the logistic partner(null if not shipped)"
      - name: order_delivered_customer_at
        description: "Shows the actual order delivery date to the customer(null if not delivered)"
      - name: order_estimated_delivery_at
        description: "Shows the estimated delivery date that was informed to customer at the purchase moment"
      - name: days_to_delivery
        description: "Days between order purchase and delivery (null if not delivered)"
      - name: is_shipped
        description: "Boolean indicator of order shipping status"
      - name: is_delivered
        description: "Boolean indicator of order delivery status"
  - name: stg_redo_order_items
    description: "This dataset includes data about the items purchased within each order with standardized pricing and derived costs"
    columns:
      - name: order_id
        description: "Unique identifier of the order"
      - name: order_item_id
        description: "Sequential number identifying number of items included in the same order"
        tests:
          - not_null
      - name: product_id
        description: "Product unique identifier"
        tests:
          - not_null
      - name: seller_id
        description: "Seller unique identifier"
        tests:
          - not_null
      - name: shipping_limit_at
        description: "Shows the seller shipping limit date for handling the order over to the logistic partner"
      - name: price
        description: "Item price nulls replaced with 0"
        tests:
          - not_negative
      - name: freight_value
        description: "Shipping cost, nulls replaced with 0"
        tests:
          - not_negative
      - name: total_item_cost
        description: "Total cost (price + freight_value)"
        tests:
          - not_negative
    tests:
      - unique:
          column_name: "(order_id, order_item_id)"
  - name: stg_redo_order_payments
    description: "This dataset includes standardized data about the orders payment options and installment flag"
    columns:
      - name: order_id
        description: "Unique identifier of the order"
        tests:
          - not_null
      - name: payment_sequential
        description: "A customer may pay an order with more than one payment method. If he does so, a sequence will be created to"
        tests:
          - not_null
      - name: payment_type
        description: "Method of payment chosen by the customer, null replaced with 'unknown', standardized to lowercase"
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined', 'unknown']
      - name: payment_installments
        description: "Number of installments chosen by the customer, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: payment_value
        description: "Transaction value, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: is_installment_payment
        description: "Boolean indicating if payment is in multiple installments"
        tests:
          - not_null
    tests:
      - unique:
          column_name: "(order_id, payment_sequential)"
  - name: stg_redo_products
    description: "This dataset includes data about the products sold by Olist, standardized and added volumetric weight"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Root category of product, in Portuguese, nulls replaced with 'unknown'"
        tests:
          - not_null
      - name: product_name_length
        description: "Number of characters extracted from the product name, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: product_description_length
        description: "Number of characters extracted from the product description, nulls replaced with 0."
        tests:
          - not_null
          - not_negative
      - name: product_photos_qty
        description: "Number of product published photos, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: product_weight_g
        description: "Product weight in grams, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: product_length_cm
        description: "Product length in cm, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: product_height_cm
        description: "Product height in cm, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: product_width_cm
        description: "Product width in cm, nulls replaced with 0"
        tests:
          - not_null
          - not_negative
      - name: volumetric_weight_kg
        description: "Volumetric weight in kg (length * width * height / 5000), null dimensions replaced with 0 "
        tests:
          - not_null
          - not_negative